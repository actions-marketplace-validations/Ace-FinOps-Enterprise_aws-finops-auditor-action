name: 'AWS FinOps Cost Auditor'
description: 'Read-only AWS FinOps CLI auditor for CI/CD to detect idle EC2, orphaned EBS volumes, and unattached Elastic IPs.'
author: 'Ace Engineering'
branding:
  icon: 'dollar-sign'
  color: 'green'

inputs:
  file:
    description: 'Optional CSV file path for offline/demo mode instead of live AWS API calls'
    required: false
    default: ''
  region:
    description: 'AWS region(s) to scan in live mode, comma-separated (default: us-east-1)'
    required: false
    default: 'us-east-1'
  fail-on-waste:
    description: 'Fail workflow if monthly waste in USD exceeds this threshold (e.g., 100). Empty disables failure. Pro feature: requires gumroad_license_key.'
    required: false
    default: ''
  gumroad_license_key:
    description: 'Optional Gumroad license key (Pro subscription). Pass it as a repository secret named GUMROAD_LICENSE_KEY. Unlocks Bash remediation artifacts, CSV compliance exports, and fail-on-waste threshold enforcement.'
    required: false
    default: ''
  package-version:
    description: 'PyPI version constraint for aws-finops-auditor'
    required: false
    default: '>=1.2.0'

outputs:
  monthly-waste:
    description: 'Total identified monthly AWS waste in USD'
    value: ${{ steps.audit.outputs.monthly_waste }}
  annual-waste:
    description: 'Total identified annualized AWS waste in USD'
    value: ${{ steps.audit.outputs.annual_waste }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install aws-finops-auditor
      shell: bash
      run: pip install --quiet "aws-finops-auditor${{ inputs.package-version }}"

    - name: Run AWS FinOps Audit
      id: audit
      shell: bash
      env:
        INPUT_FILE: ${{ inputs.file }}
        INPUT_REGION: ${{ inputs.region }}
        FAIL_THRESHOLD: ${{ inputs.fail-on-waste }}
        GUMROAD_LICENSE_KEY: ${{ inputs.gumroad_license_key }}
      run: |
        python3 - << 'EOF'
        import os, re, subprocess, sys

        cmd = ["aws-finops-auditor"]
        input_file = os.environ.get("INPUT_FILE", "").strip()
        if input_file:
            cmd.extend(["--file", input_file])
        else:
            # No file: run a live scan against the AWS account (1.2.0+).
            cmd.append("--live")
            region = os.environ.get("INPUT_REGION", "").strip()
            if region:
                cmd.extend(["--region", region])
        # Only add the Pro flags when a key is present: passed without a
        # key they would hit the verifier's upsell exit and break free runs.
        if os.environ.get("GUMROAD_LICENSE_KEY", "").strip():
            cmd.extend(["--remediate", "--compliance"])
        thresh = os.environ.get("FAIL_THRESHOLD", "").strip()
        if thresh:
            cmd.extend(["--fail-on-waste", thresh])

        proc = subprocess.run(cmd, capture_output=True, text=True)
        output = (proc.stdout or "") + ("\n" + proc.stderr if proc.stderr else "")
        print(output)

        monthly = 0.0
        for pattern in [
            r"TOTAL PROJECTED MONTHLY LEAK:\s*\$([0-9,]+\.[0-9]{2})",
            r"Total Waste Identified:\s*\$([0-9,]+\.[0-9]{2})",
            r"TOTAL POTENTIAL SAVINGS:\s*\$([0-9,]+\.[0-9]{2})",
            r"Total Monthly Waste:\s*\$([0-9,]+\.[0-9]{2})",
        ]:
            m = re.search(pattern, output, re.IGNORECASE)
            if m:
                monthly = float(m.group(1).replace(",", ""))
                break

        annual = round(monthly * 12, 2)

        gh_out = os.environ.get("GITHUB_OUTPUT")
        if gh_out:
            with open(gh_out, "a", encoding="utf-8") as f:
                f.write(f"monthly_waste={monthly:.2f}\n")
                f.write(f"annual_waste={annual:.2f}\n")

        gh_sum = os.environ.get("GITHUB_STEP_SUMMARY")
        if gh_sum:
            with open(gh_sum, "a", encoding="utf-8") as f:
                f.write("## AWS FinOps Cost Audit Summary\n\n")
                f.write(f"- **Recoverable Monthly Spend:** `${monthly:,.2f}/mo`\n")
                f.write(f"- **Annualized Impact:** `${annual:,.2f}/yr`\n\n")
                f.write("> Need multi-account AWS Organization scanning, PDF executive showback reports, or 1-click bash remediation scripts? [Upgrade to Practitioner ($149/yr) / Agency ($999/yr)](https://aisser.gumroad.com/l/krgac?utm_source=github_action)\n")

        if proc.returncode != 0:
            sys.exit(proc.returncode)
        EOF